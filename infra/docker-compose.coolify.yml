# G3 — deploy no Coolify (Docker Compose build pack).
# Diferente do docker-compose.prod.yml: SEM o serviço `caddy` — o Coolify já tem
# o próprio proxy (Traefik) na 80/443 e cuida de domínios + TLS por serviço.
#
# No Coolify:
#   1. Aplicação Git Based -> Private Repository (with GitHub App)
#   2. Build Pack: Docker Compose | arquivo: infra/docker-compose.coolify.yml
#   3. Defina as variáveis de ambiente (aba Environment Variables)
#   4. Atribua um domínio a cada serviço exposto (site/api/aluno/backoffice)
#   Ver docs/DEPLOY-COOLIFY.md.

name: g3

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Coolify atribui o domínio (ex.: api.g3saude.edu.br) a este serviço na porta 3333.
    expose:
      - '3333'
    environment:
      NODE_ENV: production
      API_PORT: '3333'
      # Publica o catálogo (curso) no primeiro deploy: defina SEED_ON_START=true
      # nas Environment Variables do Coolify. Sem esta linha, a var da UI não
      # chega ao container e o seed não roda (banco fica sem cursos → site vazio).
      SEED_ON_START: ${SEED_ON_START:-false}
      APP_URL: ${APP_URL}
      # URL pública da própria API: monta a URL dos arquivos enviados no admin.
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      # Pasta dos uploads — aponte um Persistent Storage do Coolify para cá,
      # senão as capas somem no próximo deploy (disco do container é efêmero).
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      # Nome conforme o schema de config da API (config/configuration.ts).
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      VIMEO_ACCESS_TOKEN: ${VIMEO_ACCESS_TOKEN:-}
      # IA opcional no backoffice ("Gerar com IA"): sem a chave, fica desativada.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:${UPLOADS_DIR:-/data/uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  site:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
      args:
        # URLs PÚBLICAS assadas no bundle do navegador em `next build`
        # (checkout e link "Área do aluno"). Sem elas o bundle cai no default
        # de dev (localhost) e o checkout quebra em produção.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    restart: unless-stopped
    # Domínio: g3saude.edu.br -> porta 3000.
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      # A API é acessada pela rede privada do Compose (render server-side).
      API_URL: http://api:3333
      PORT: '3000'
    depends_on:
      - api

  aluno:
    build:
      context: ..
      dockerfile: apps/aluno/Dockerfile
      args:
        # URL PÚBLICA da API — assada no bundle. Ex.: https://api.g3saude.edu.br
        VITE_API_URL: ${PUBLIC_API_URL}
        # URL do site, usada nos CTAs que levam ao catálogo.
        VITE_SITE_URL: ${APP_URL}
    restart: unless-stopped
    # Domínio: app.g3saude.edu.br -> porta 80.
    expose:
      - '80'

  backoffice:
    build:
      context: ..
      dockerfile: apps/backoffice/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    # Domínio: admin.g3saude.edu.br -> porta 80.
    expose:
      - '80'

volumes:
  pgdata:
  redisdata:
  uploads:
